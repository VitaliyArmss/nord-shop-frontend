name: Deploy React app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-fund
      - name: Build site
        run: npm run build
      - name: Verify production paths and API URL
        shell: bash
        run: |
          if ! grep -q -F '/nord-shop-frontend/assets/' dist/index.html; then
            echo "::error::Built index.html does not contain the GitHub Pages asset base path."
            exit 1
          fi
          if ! grep -R -q -F 'https://api.vitaliy-armss.ru/nord-shop/api' dist/assets; then
            echo "::error::Production bundle does not contain the expected Nord-shop API URL."
            exit 1
          fi
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
